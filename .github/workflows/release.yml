name: Release

# Builds the bgg-mcp binaries and attaches them to the release for a tag.
# Runs when a v* tag is pushed by hand, and is called by release-please.yml
# for the tags release-please creates (see the note there).
on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: The release tag to build and attach the binaries to.
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build binaries
        run: |
          mkdir -p dist
          platforms=(
            "linux/amd64"
            "linux/arm64"
            "darwin/amd64"
            "darwin/arm64"
            "windows/amd64"
          )
          for platform in "${platforms[@]}"; do
            os="${platform%/*}"
            arch="${platform#*/}"
            output="dist/bgg-mcp-${os}-${arch}"
            if [ "$os" = "windows" ]; then
              output="${output}.exe"
            fi
            echo "Building ${os}/${arch}..."
            GOOS=$os GOARCH=$arch go build -o "$output" ./cmd/bgg-mcp/
          done

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          # release-please writes its own notes into the release it creates;
          # generate them only for a tag pushed by hand.
          generate_release_notes: ${{ !inputs.tag }}
          files: dist/*
